[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "he-gene-rl"
version = "0.1.0"
description = "Histology-conditioned gene selection with predicted histories and PPO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
he-gene-rl = "he_gene_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

